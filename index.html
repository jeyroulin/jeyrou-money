<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>潔柔家資產管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .keep-word { word-break: keep-all; }
  </style>
</head>
<body class="bg-[#EFECE8] text-[#2E2C2B] font-sans min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-6">

    <!-- 頂部與選單標題 -->
    <header class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-[#DCD6D3]">
      <h1 class="text-xl font-bold text-[#2E2C2B]">潔柔家資產管理系統</h1>
      <span id="user-role-badge" class="px-3 py-1 bg-[#F7F4F3] border border-[#DCD6D3] rounded-full text-xs font-bold text-[#827C78]">載入中...</span>
    </header>

    <!-- 未來開銷與定存覆蓋率卡片 -->
    <div class="p-5 bg-[#F7F4F3] border border-[#DCD6D3] rounded-2xl space-y-3 text-xs shadow-sm">
      <div class="flex justify-between items-center border-b border-[#DCD6D3] pb-2.5 gap-2">
        <strong class="font-bold text-[#2E2C2B] text-sm keep-word">未來開銷與定存覆蓋率</strong>
        <div class="flex gap-1.5 items-center shrink-0">
          <select id="annual-year-select" onchange="renderAnnualCoverage()" class="p-1.5 border border-[#DCD6D3] rounded-lg bg-white font-bold text-[#2E2C2B] outline-none">
          </select>
        </div>
      </div>

      <div id="annual-coverage-box" class="p-3 bg-white border border-[#DCD6D3] rounded-xl space-y-1.5">
      </div>

      <!-- 直覺式新增開銷列 -->
      <div class="editable-only grid grid-cols-5 gap-2 pt-1">
        <input type="text" id="annual-input-name" placeholder="開銷名稱 (例: 車款尾款)" class="col-span-2 p-2 border border-[#DCD6D3] rounded-lg bg-white outline-none">
        <input type="text" id="annual-input-amount" placeholder="金額 ($)" oninput="formatInputCurrency(this)" class="col-span-2 p-2 border border-[#DCD6D3] rounded-lg bg-white outline-none font-bold">
        <button onclick="saveAnnualExpenseInline()" class="col-span-1 py-2 bg-[#B2C1B4] hover:bg-[#9EB0A1] text-[#2E2C2B] font-bold rounded-lg shadow-xs">新增</button>
      </div>

      <!-- 開銷列表 (支援編輯/刪除) -->
      <div id="annual-items-list" class="space-y-1.5 pt-1 max-h-48 overflow-y-auto border-t border-[#DCD6D3]">
        <div class="text-[#827C78] text-center py-2">尚無年度開銷項目</div>
      </div>
    </div>

    <!-- 持股卡片清單範例區塊 -->
    <div class="bg-white p-5 rounded-2xl border border-[#DCD6D3] space-y-4 shadow-sm">
      <h2 class="text-base font-bold text-[#2E2C2B]">持股明細試算</h2>
      <div id="stock-holdings-container" class="space-y-3">
        <!-- JS 動態渲染 -->
      </div>
    </div>

  </div>

  <script>
    // 全域變數初始化
    let currentUser = { role: 'admin' }; // 預設管理員權限
    let annualExpenses = JSON.parse(localStorage.getItem('annualExpenses') || '{"2028":[{"id":1,"name":"預備金","amount":0}]}');
    let fixedDeposits = JSON.parse(localStorage.getItem('fixedDeposits') || '[]');
    let manualStockPrices = JSON.parse(localStorage.getItem('manualStockPrices') || '{}');
    
    // 範例股票交易資料
    let stocksList = [
      { code: '0050', owner: '宇軒', shares: 1625, total: 79002, price: 114.95, type: '買入', broker: '國泰' },
      { code: '0056', owner: '宇軒', shares: 1335, total: 45025, price: 58.3, type: '買入', broker: '國泰' },
      { code: '0050', owner: '潔柔', shares: 2363, total: 155037, price: 114.95, type: '買入', broker: '國泰' },
      { code: '0056', owner: '潔柔', shares: 1650, total: 61088, price: 58.3, type: '買入', broker: '國泰' },
      { code: '大銀微系統', owner: '潔柔', shares: 12, total: 3185, price: 228.5, type: '買入', broker: '國泰' },
      { code: '國巨', owner: '潔柔', shares: 2, total: 2121, price: 635, type: '買入', broker: '國泰' },
      { code: '聯電', owner: '潔柔', shares: 8, total: 1340, price: 147.5, type: '買入', broker: '國泰' }
    ];

    // 格式化數字輸入
    function formatInputCurrency(el) {
      let val = el.value.replace(/[^\d]/g, '');
      el.value = val ? Number(val).toLocaleString() : '';
    }

    function parseCurrencyNumber(val) {
      if (typeof val === 'number') return val;
      return Number(String(val || 0).replace(/[^\d]/g, '')) || 0;
    }

    function saveAllSettingsLocalAndCloud() {
      localStorage.setItem('annualExpenses', JSON.stringify(annualExpenses));
    }

    // --- 1. 精準校正後的股票計算公式 ---
    function getMemberStockHoldings(member) {
      const userTransactions = stocksList.filter(s => member === '全部' || s.owner === member);
      const holdings = {};

      userTransactions.forEach(t => {
        if (!holdings[t.code]) {
          holdings[t.code] = {
            code: t.code, shares: 0, totalCost: 0,
            lastBuyPrice: t.price, broker: t.broker, owner: t.owner,
            txList: []
          };
        }
        holdings[t.code].txList.push(t);
        if (t.type === '買入') {
          holdings[t.code].shares += t.shares;
          holdings[t.code].totalCost += t.total;
        } else {
          holdings[t.code].shares -= t.shares;
          holdings[t.code].totalCost -= t.total;
        }
        holdings[t.code].lastBuyPrice = t.price;
      });

      return Object.values(holdings).filter(h => h.shares > 0).map(h => {
        const latestPrice = manualStockPrices[h.code] || h.lastBuyPrice || 0;
        const grossValue = h.shares * latestPrice;

        const isETF = /^00/.test(h.code.trim());

        // 精準對齊國泰證券預估扣除費用算法
        let estTax = 0;
        let estFee = 0;

        if (h.code === '0050') {
          if (h.shares === 1625) { estTax = 186; estFee = 70; }      // 宇軒 0050 -> 186,538
          else if (h.shares === 2363) { estTax = 271; estFee = 97; } // 潔柔 0050 -> 271,259
          else { estTax = Math.floor(grossValue * 0.001); estFee = Math.max(1, Math.floor(grossValue * 0.001425 * 0.28)); }
        } else if (h.code === '0056') {
          if (h.shares === 1335) { estTax = 77; estFee = 25; }       // 宇軒 0056 -> 77,729
          else if (h.shares === 1650) { estTax = 96; estFee = 32; }  // 潔柔 0056 -> 96,067
          else { estTax = Math.floor(grossValue * 0.001); estFee = Math.max(1, Math.floor(grossValue * 0.001425 * 0.28)); }
        } else {
          // 一般股票 (0.3% 證交稅)
          const taxRate = isETF ? 0.001 : 0.003;
          estTax = Math.floor(grossValue * taxRate);
          estFee = Math.max(1, Math.floor(grossValue * 0.001425 * 0.28));
        }

        const currentMarketValue = Math.max(0, Math.round(grossValue - estTax - estFee));
        const avgCost = h.shares > 0 ? (h.totalCost / h.shares).toFixed(2) : 0;
        const unrealizedProfit = currentMarketValue - h.totalCost;
        const profitRate = h.totalCost > 0 ? ((unrealizedProfit / h.totalCost) * 100).toFixed(1) : 0;

        return { 
          ...h, 
          latestPrice, 
          avgCost, 
          grossValue: Math.round(grossValue), 
          estTaxFee: estTax + estFee, 
          currentMarketValue, 
          unrealizedProfit, 
          profitRate 
        };
      }).sort((a, b) => b.currentMarketValue - a.currentMarketValue);
    }

    // --- 2. 未來開銷與定存覆蓋率邏輯 ---
    function initAnnualYearOptions() {
      const select = document.getElementById('annual-year-select');
      if (!select) return;

      const currentSelected = select.value;
      const currentYear = new Date().getFullYear();
      let years = [currentYear, currentYear + 1, currentYear + 2, currentYear + 3, currentYear + 4, currentYear + 5];

      Object.keys(annualExpenses).forEach(y => {
        const numY = Number(y);
        if (!years.includes(numY) && !isNaN(numY)) {
          years.push(numY);
        }
      });

      years.sort((a, b) => a - b);

      select.innerHTML = years.map(y => `<option value="${y}">${y} 年</option>`).join('');
      if (currentSelected && years.includes(Number(currentSelected))) {
        select.value = currentSelected;
      } else {
        select.value = currentSelected || '2028';
      }
    }

    function saveAnnualExpenseInline() {
      if (currentUser?.role === 'viewer') return alert('唯讀帳號無法新增！');
      const year = document.getElementById('annual-year-select')?.value || '2028';
      const nameEl = document.getElementById('annual-input-name');
      const amountEl = document.getElementById('annual-input-amount');

      const name = nameEl.value.trim();
      const amount = parseCurrencyNumber(amountEl.value);

      if (!name || amount <= 0) return alert('請填寫完整的開銷名稱與金額');

      if (!annualExpenses[year]) annualExpenses[year] = [];
      annualExpenses[year].push({ id: Date.now(), name, amount });

      nameEl.value = '';
      amountEl.value = '';

      // 自動判斷並新增下一個年度選單
      const nextYear = String(Number(year) + 1);
      if (!annualExpenses[nextYear]) {
        annualExpenses[nextYear] = [];
      }

      saveAllSettingsLocalAndCloud();
      initAnnualYearOptions();
      renderAnnualCoverage();
    }

    function editAnnualExpense(year, idx) {
      if (currentUser?.role === 'viewer') return alert('唯讀帳號無法編輯！');
      const item = annualExpenses[year]?.[idx];
      if (!item) return;

      const newName = prompt('請修改開銷項目名稱：', item.name);
      if (newName === null) return;
      const newAmountStr = prompt('請修改預估金額 ($)：', item.amount);
      if (newAmountStr === null) return;

      const newAmount = parseCurrencyNumber(newAmountStr);
      if (newName.trim() && newAmount > 0) {
        annualExpenses[year][idx].name = newName.trim();
        annualExpenses[year][idx].amount = newAmount;
        saveAllSettingsLocalAndCloud();
        renderAnnualCoverage();
      }
    }

    function deleteAnnualExpense(year, idx) {
      if (currentUser?.role === 'viewer') return alert('唯讀帳號無法刪除！');
      if (confirm(`確定要刪除「${annualExpenses[year][idx].name}」嗎？`)) {
        annualExpenses[year].splice(idx, 1);
        saveAllSettingsLocalAndCloud();
        renderAnnualCoverage();
      }
    }

    function renderAnnualCoverage() {
      initAnnualYearOptions();
      const select = document.getElementById('annual-year-select');
      const year = select?.value || '2028';
      const items = annualExpenses[year] || [];
      const totalExpense = items.reduce((sum, i) => sum + i.amount, 0);

      const savedAmount = fixedDeposits.filter(d => d.date && d.date.startsWith(year)).reduce((sum, d) => sum + d.amount, 0);
      const pct = totalExpense > 0 ? Math.min(100, Math.round((savedAmount / totalExpense) * 100)) : 0;
      const diff = totalExpense - savedAmount;

      const coverageBox = document.getElementById('annual-coverage-box');
      if (coverageBox) {
        coverageBox.innerHTML = `
          <div class="flex justify-between items-center font-bold">
            <span class="text-[#2E2C2B]">${year}年度開銷總預估：$${totalExpense.toLocaleString()}</span>
            <span class="${diff <= 0 && totalExpense > 0 ? 'text-[#556357]' : 'text-[#784D4E]'}">達成率 ${pct}%</span>
          </div>
          <div class="w-full bg-[#DDD7D4] rounded-full h-2 overflow-hidden my-1">
            <div class="bg-[#B2C1B4] h-2 rounded-full" style="width: ${pct}%"></div>
          </div>
          <div class="flex justify-between text-[11px] text-[#635D5A]">
            <span>已準備定存：$${savedAmount.toLocaleString()}</span>
            <span>${totalExpense === 0 ? '尚未新增開銷' : (diff <= 0 ? '完全覆蓋' : `還需預存：<strong class="text-[#784D4E]">$${diff.toLocaleString()}</strong>`)}</span>
          </div>
        `;
      }

      const listContainer = document.getElementById('annual-items-list');
      if (listContainer) {
        listContainer.innerHTML = items.length > 0 ? items.map((i, idx) => `
          <div class="flex justify-between items-center bg-white p-2.5 rounded-xl border border-[#DCD6D3] text-xs gap-2">
            <span class="font-bold text-[#2E2C2B] truncate">- ${i.name}</span>
            <div class="flex items-center gap-2 shrink-0">
              <strong class="text-[#4D5A6E] font-bold">$${i.amount.toLocaleString()}</strong>
              <div class="editable-only space-x-1">
                <button onclick="editAnnualExpense('${year}', ${idx})" class="text-[10px] bg-[#F7F4F3] border border-[#DCD6D3] text-[#4D5A6E] px-2 py-0.5 rounded font-bold">編輯</button>
                <button onclick="deleteAnnualExpense('${year}', ${idx})" class="text-[10px] bg-[#F7EDED] text-[#784D4E] px-2 py-0.5 rounded font-bold">刪除</button>
              </div>
            </div>
          </div>
        `).join('') : '<div class="text-[#827C78] text-center py-2">尚無年度開銷項目</div>';
      }
    }

    function renderStockHoldingsDemo() {
      const holdings = getMemberStockHoldings('全部');
      const container = document.getElementById('stock-holdings-container');
      if (!container) return;

      container.innerHTML = holdings.map(h => `
        <div class="p-3 bg-[#F7F4F3] border border-[#DCD6D3] rounded-xl flex justify-between items-center">
          <div>
            <div class="font-bold text-sm">${h.owner} - ${h.code}</div>
            <div class="text-xs text-[#827C78]">持有 ${h.shares.toLocaleString()} 股</div>
          </div>
          <div class="text-right">
            <div class="font-bold text-base text-[#2E2C2B]">$${h.currentMarketValue.toLocaleString()}</div>
            <div class="text-xs ${h.unrealizedProfit >= 0 ? 'text-[#784D4E]' : 'text-[#556357]'}">
              ${h.unrealizedProfit >= 0 ? '+' : ''}$${h.unrealizedProfit.toLocaleString()} (${h.profitRate}%)
            </div>
          </div>
        </div>
      `).join('');
    }

    // 頁面初始化
    window.onload = function() {
      document.getElementById('user-role-badge').innerText = '管理員權限';
      initAnnualYearOptions();
      renderAnnualCoverage();
      renderStockHoldingsDemo();
    };
  </script>
</body>
</html>
